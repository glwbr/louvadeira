[tools]
go = "1.27.3"
node = "26.11.1"
pnpm = "12.11.2"

[tasks."web:install"]
description = "Instala as dependências do PWA"
run = "pnpm --dir web install --frozen-lockfile"

[tasks."web:build"]
description = "Compila o PWA e copia para dentro do servidor Go"
depends = ["web:install"]
run = """
set -e
pnpm --dir web build
find server/internal/webui/dist -mindepth 1 ! -name .gitkeep -delete
cp -R web/dist/. server/internal/webui/dist/
"""

[tasks.build]
description = "Gera bin/louvadeira para esta máquina"
depends = ["web:build"]
dir = "server"
run = "go build -o ../bin/louvadeira ./cmd/louvadeira"

[tasks."build:linux"]
description = "Gera bin/louvadeira-linux-amd64 e bin/louvadeira-linux-arm64 para servidores"
depends = ["web:build"]
dir = "server"
env = { CGO_ENABLED = "0", GOOS = "linux" }
run = [
  "GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o ../bin/louvadeira-linux-amd64 ./cmd/louvadeira",
  "GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o ../bin/louvadeira-linux-arm64 ./cmd/louvadeira",
]

[tasks.test]
description = "Testes e verificações do servidor e do front"
depends = ["web:install"]
run = [
  "cd server && go vet ./... && go test ./...",
  "pnpm --dir web typecheck",
  "pnpm --dir web lint",
]

[tasks."dev:server"]
description = "Servidor local em :8090 (dados em ./data)"
dir = "server"
env = { LOUVADEIRA_DATA_DIR = "../data" }
run = "go run ./cmd/louvadeira serve"

[tasks."dev:web"]
description = "Front com recarga automática em :5173 (usa o servidor local)"
depends = ["web:install"]
dir = "web"
run = "pnpm dev"

[tasks.deploy]
description = "Compila para Linux e publica no servidor (LOUVADEIRA_HOST)"
depends = ["build:linux"]
run = "deploy/deploy.sh"
